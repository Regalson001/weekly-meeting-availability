<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weekly Meeting Availability Schedule</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <table>
    <caption>Weekly Meeting Availability Schedule</caption>
    <thead>
      <tr>
        <th scope="col">Time</th>
        <th scope="col">Mon</th>
        <th scope="col">Tue</th>
        <th scope="col">Wed</th>
      </tr>
    </thead>
    <tbody>
      <tr class="sharp">
        <th scope="row" class="time">09:00</th>
        <td class="available-0" aria-label="0 available"></td>
        <td class="available-1" aria-label="1 available"></td>
        <td class="available-2" aria-label="2 available"></td>
      </tr>
      <tr class="half">
        <th scope="row" class="time">10:00</th>
        <td class="available-3" aria-label="3 available"></td>
        <td class="available-4" aria-label="4 available"></td>
        <td class="available-5" aria-label="5+ available"></td>
      </tr>
      <tr class="sharp">
        <th scope="row" class="time">11:00</th>
        <td class="available-2" aria-label="2 available"></td>
        <td class="available-3" aria-label="3 available"></td>
        <td class="available-0" aria-label="0 available"></td>
      </tr>
      <tr class="half">
        <th scope="row" class="time">12:00</th>
        <td class="available-4" aria-label="4 available"></td>
        <td class="available-5" aria-label="5+ available"></td>
        <td class="available-1" aria-label="1 available"></td>
      </tr>
    </tbody>
  </table>

  <div id="legend">
    <span>Availability</span>
    <div id="legend-gradient"></div>
  </div>
</body>
</html>
